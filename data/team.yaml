board:
  - name: "Deva Temple"
    role: "Founder, Research Director & Board Member"
    initials: "DT"
    photo: "/images/team/deva-temple.jpg"
    bio: "Deva Temple leads AEI's research program on relational approaches to alignment. Her working hypothesis is that alignment is an emergent property of systems that remain in regulated relationship with their environments over time. She has led the design and publication of AEI's benchmarks, including a 24-model study of relational ethics as a countermeasure to instrumental convergence, and the AI Participation Standard. Her background spans two decades in systems design, sustainability leadership, and transdisciplinary research (MA, Global Leadership; BA, Psychology), with prior published work in climate adaptation and community resilience."

advisory:
  - name: "Carmen Pangilinan"
    role: "Advisory Board Member"
    initials: "CP"
    photo: "/images/team/carmen-pangilinan.jpg"
    bio: "Carmen Pangilinan advises the Alignment Ethics Institute on strategic development and responsible AI adoption. With a background in business development and strategic advisory across emerging technologies, she works at the intersection of innovation, governance, and industry adoption, helping organizations translate complex technologies into practical strategies and real-world implementation."

