baseURL = "https://alignmentethics.org/"
languageCode = "en-us"
title = "Alignment Ethics Institute"

# Site parameters
[params]
  description = "The Alignment Ethics Institute studies whether AI systems can form and maintain stable ethical behavior, and builds the instruments to measure it."
  ogImage = "/images/logo.png"

# Main navigation menu
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menus.main]]
